name: GhostCorp agency tests

on:
  push:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
