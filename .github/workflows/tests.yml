name: GhostCorp agency tests

on:
  push:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/tests.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build backend container
        run: docker build --tag ghostcorp-backend:test .
      - name: Smoke-test container with persistent data mount
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ghostcorp-smoke-data"
          docker run -d --stop-timeout 5 --name ghostcorp-backend-smoke \
            -p 8765:8000 \
            -e PORT=8000 \
            -v "$RUNNER_TEMP/ghostcorp-smoke-data:/data" \
            ghostcorp-backend:test
          for attempt in {1..40}; do
            if curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:8765/health; then
              docker stop --time 5 ghostcorp-backend-smoke
              docker rm ghostcorp-backend-smoke
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ghostcorp-backend-smoke 2>/dev/null || echo false)" != "true" ]; then
              break
            fi
            sleep 1
          done
          docker logs ghostcorp-backend-smoke || true
          docker rm -f ghostcorp-backend-smoke || true
          exit 1
